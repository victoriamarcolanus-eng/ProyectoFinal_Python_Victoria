{% extends "blog/padre.html" %}

{% block contenido_que_cambia %}
    <article>
        <h1>{{ post.titulo }}</h1>
        <h3 style="color: #666;">{{ post.subtitulo }}</h3>
        <p style="color: #888;">Publicado el {{ post.fecha|date:"d/m/Y" }} por {{ post.autor }}</p>
        
        <hr>

        {% if post.imagen %}
            <img src="{{ post.imagen.url }}" style="width: 100%; max-width: 600px; border-radius: 10px; margin-bottom: 20px;">
        {% endif %}

        <div style="line-height: 1.6; font-size: 1.1em;">
            {{ post.cuerpo|safe }}
        </div>

        <br>
        <a href="{% url 'pages' %}" style="display: inline-block; margin-top: 20px; color: #007bff;">← Volver al listado</a>
    </article>
{% endblock %}
